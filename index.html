<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HBD Letter for my Piona</title>
<style>
  @page {
    size: 1414px 2000px;
    margin: 0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #ddd;
    height: 100%;
  }
  .wrap {
    height: 100vh;
    height: 100svh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .letter-img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
  }
  @media print {
    body { background: none; }
    .wrap { height: auto; display: block; }
    .letter-img { max-width: none; max-height: none; width: 1414px; height: auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <img class="letter-img" src="pio.png">
